[package]
name = "wxi"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe      = { version = "0.33.3", features = ["default"] }
serialport  = "4.6"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
thiserror          = "2"
dirs        = "5"

[profile.release]
opt-level = 3
lto       = "thin"
