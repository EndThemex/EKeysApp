[package]
name        = "EKeysPad"
version     = "0.1.0"
edition     = "2024"
rust-version = "1.85"
description = "Desktop controller for the EKeys keyboard firmware — config / keymap / lighting / WiFi / voice / audio / OTA over USB CDC serial"
license     = "MIT"
authors     = ["EndThemex"]
readme      = "README.md"
homepage    = "https://github.com/EndThemex/EKeysApp"
repository  = "https://github.com/EndThemex/EKeysApp"
keywords    = ["egui", "eframe", "serialport", "keyboard", "hid", "embedded", "ota"]
categories  = ["gui", "hardware-support", "embedded"]

[dependencies]
eframe        = { version = "0.33.3", features = ["default"] }
egui-phosphor = "0.11"
serialport    = "4.6"
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
thiserror          = "2"
dirs          = "5"
image         = { version = "0.25", default-features = false, features = ["png", "ico"] }
base64        = "0.22"
# OTA：固件 MD5 校验 + 原生文件选择对话框
md-5          = "0.10"
rfd           = "0.15"
# 与 serialport 4.x 共用同一版本，避免重复拉入 windows-sys 多版本
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Networking_WinInet",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Foundation",
] }

# Windows：把 img/icon.ico 嵌入 exe 资源，使打包后的 exe 也使用同一图标
[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto       = "thin"
